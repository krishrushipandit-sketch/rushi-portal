services:
  postgres:
    image: postgres:15-alpine
    container_name: rushi_portal_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rushi_portal}
      POSTGRES_USER: ${POSTGRES_USER:-rushi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-RushiPanditPass2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../SETUP-POSTGRES-COMPLETE.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rushi_admin -d rushi_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: vps-setup/Dockerfile
    container_name: rushi_portal_app
    restart: always
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://rushi_admin:RushiPanditPass2026!@postgres:5432/rushi_portal
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-rushi_super_secret_jwt_2026}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://portal.rushipandit.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://portal.rushipandit.com}
      - PABBLY_WEBHOOK_SECRET=${PABBLY_WEBHOOK_SECRET:-rushi_pabbly_secret_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AISENSY_API_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY2NzJjOTQ5NmM3YjZlMTM5NWJkYmIzOSIsIm5hbWUiOiJSdXNoaVBhbmRpdCAtIERpZ2l0YWwgQWNhZGVteSIsImFwcE5hbWUiOiJBaVNlbnN5IiwiY2xpZW50SWQiOiI2NjcyYzk0ODZjN2I2ZTEzOTViZGJiMjciLCJhY3RpdmVQbGFuIjoiQkFTSUNfTU9OVEhMWSIsImlhdCI6MTc4NzczMzYwOX0.7z3K8tMpMK9YunrZ1WiICIwEXkgJP4RoRaMX0lm0Im8
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
